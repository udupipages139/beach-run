<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Udupipages Beach Run 2026</title>
    <script>
      // SPA Fallback redirect for static servers without server-side rewrite rules
      // Preserves deep route (e.g., /admin) by redirecting to /#admin
      (function() {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var cleanPath = path.replace(/^\/+/, '');
        if (!cleanPath && !search) return;
        window.location.replace('/#' + cleanPath + search + hash);
      })();
    </script>
  </head>
  <body style="background-color: #0A0A0A; color: #F5F3EE; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <p style="font-size: 1.1rem; color: #FF7A30;">Loading Udupipages Beach Run 2026...</p>
    </div>
  </body>
</html>
