services:
  - type: web
    name: udupipages-beach-run-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://udupipages-beach-run-backend.vercel.app/api
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
